services:
  agent:
    depends_on:
      gh-token:
        condition: "service_started"
    environment:
      DCC_GH_HOST: "${DCC_GH_HOST:-github.com}"
      DCC_GH_TOKEN_URI: "http://127.0.0.1:${DCC_GH_TOKEN_PORT:-8082}/token"
    volumes:
      - read_only: true
        source: "${DCC_CONFIG_DIR:-${HOME}/.config/dcc}/capabilities/gh/agent"
        target: "/usr/local/lib/dcc/gh"
        type: "bind"
  gh-token:
    build:
      context: "${DCC_CONFIG_DIR:-${HOME}/.config/dcc}/capabilities/gh"
    environment:
      BIND_PORT: "${DCC_GH_TOKEN_PORT:-8082}"
      GH_HOST: "${DCC_GH_HOST:-github.com}"
    image: "dcc-gh-token:local"
    network_mode: "service:docker"
    volumes:
      - source: "gh-home"
        target: "/home/gh/.config/gh"
        type: "volume"
volumes:
  gh-home:
    external: true
    name: "${DCC_GH_HOME_VOLUME:-dcc-gh-home}"

