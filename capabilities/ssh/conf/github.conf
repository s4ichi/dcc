# Connection settings for the ssh module. This directory (conf/, overridable with DCC_SSH_CONF_DIR) is bound ro to
# /etc/ssh/dcc, which the image's /etc/ssh/ssh_config.d/dcc.conf includes. Bound as a directory so that an update of
# these files (git pull, an editor's save) reaches the container instead of leaving it on the replaced file.
# Used only for connecting to GitHub. The key is placed in ./capabilities/ssh/data (gitignored)
# as id_ed25519, and in the container it is bound ro to ~/.ssh.
# Host keys are pinned by known_hosts next to this file, so there is no first-connection confirmation prompt and
# nothing is written to ~/.ssh.
Host github.com
  User git
  IdentityFile ~/.ssh/id_ed25519
  IdentitiesOnly yes
  GlobalKnownHostsFile /etc/ssh/dcc/known_hosts
