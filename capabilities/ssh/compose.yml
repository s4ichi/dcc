services:
  agent:
    volumes:
      - read_only: true
        source: "${DCC_SSH_DIR:-${DCC_CONFIG_DIR:-${HOME}/.config/dcc}/capabilities/ssh/data}"
        target: "/home/${DCC_USER:-agent}/.ssh"
        type: "bind"
      - read_only: true
        source: "${DCC_SSH_CONF_DIR:-${DCC_CONFIG_DIR:-${HOME}/.config/dcc}/capabilities/ssh/conf}"
        target: "/etc/ssh/dcc"
        type: "bind"

