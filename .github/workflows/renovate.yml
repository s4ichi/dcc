# Renovate CLI, run weekly on this repository: opens the dependency bump PRs. What it tracks and the token it needs:
# docs/architecture.md (Dependency updates). The configuration is renovate.json.
name: renovate

on:
  schedule:
    # Monday 09:00 JST
    - cron: "0 0 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  renovate:
    name: renovate
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    env:
      # renovate: datasource=npm depName=renovate
      RENOVATE_VERSION: 44.210.0
      # Same go-jsonnet as the agent image, for `make generate` after a template.jsonnet bump
      # renovate: datasource=github-releases depName=google/go-jsonnet
      JSONNET_VERSION: v0.22.0
    steps:
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          # What Renovate's engines allow (held below 25 in renovate.json)
          node-version: "24"
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27"
          cache: false
      - name: Install jsonnet
        run: |
          go install "github.com/google/go-jsonnet/cmd/jsonnet@${JSONNET_VERSION}"
          echo "$(go env GOPATH)/bin" >>"$GITHUB_PATH"
      - name: Renovate
        run: npx --yes "renovate@${RENOVATE_VERSION}"
        env:
          RENOVATE_TOKEN: ${{ secrets.RENOVATE_TOKEN }}
          RENOVATE_PLATFORM: github
          RENOVATE_REPOSITORIES: ${{ github.repository }}
          # renovate.json is already in the repository; never open an onboarding PR
          RENOVATE_ONBOARDING: "false"
          RENOVATE_REQUIRE_CONFIG: required
          # The only postUpgradeTasks commands renovate.json uses
          RENOVATE_ALLOWED_COMMANDS: '["^make generate$", "^make sha256$"]'
