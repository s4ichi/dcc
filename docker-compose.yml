services:
  agent:
    build:
      args:
        BASE_IMAGE: "${DCC_BASE_IMAGE:-dcc:base}"
        GO_VERSION: "${DCC_GO_VERSION:-1.26.3}"
        USERNAME: "${DCC_USER:-agent}"
        USER_GID: "${DCC_GID:-${DCC_UID:-1000}}"
        USER_UID: "${DCC_UID:-1000}"
      context: "${DCC_BUILD_CONTEXT:-${DCC_CONFIG_DIR:-${HOME}/.config/dcc}}"
      dockerfile: "${DCC_DOCKERFILE:-Dockerfile}"
    cap_drop:
      - "ALL"
    command:
      - "sleep"
      - "infinity"
    depends_on:
      docker:
        condition: "service_started"
    env_file:
      - path: "${DCC_CONTAINER_ENV_FILE:-/dev/null}"
        required: false
    environment:
      DCC_CREDS: "${DCC_CREDS-}"
      DOCKER_CERT_PATH: "/certs/client"
      DOCKER_HOST: "tcp://docker:2376"
      DOCKER_TLS_VERIFY: "1"
      HOST_HOME: "${HOME}"
      TZ: "${DCC_TZ:-${TZ:-UTC}}"
    image: "${DCC_IMAGE:-dcc:local}"
    init: true
    labels:
      dcc.credentials: "${DCC_CREDS-}"
    network_mode: "service:docker"
    security_opt:
      - "no-new-privileges:true"
    volumes:
      - read_only: true
        source: "${DCC_GITCONFIG:-${HOME}/.gitconfig}"
        target: "/home/${DCC_USER:-agent}/.gitconfig"
        type: "bind"
      - source: "claude-home"
        target: "/home/${DCC_USER:-agent}/.claude"
        type: "volume"
      - source: "codex-home"
        target: "/home/${DCC_USER:-agent}/.codex"
        type: "volume"
      - read_only: true
        source: "docker-certs"
        target: "/certs"
        type: "volume"
      - read_only: true
        source: "${DCC_CONFIG_DIR:-${HOME}/.config/dcc}/lifecycle_hooks"
        target: "/usr/local/lib/dcc/hooks"
        type: "bind"
  docker:
    environment:
      DOCKER_TLS_CERTDIR: "/certs"
    image: "${DCC_DIND_IMAGE:-docker:dind-rootless}"
    privileged: true
    sysctls:
      net.ipv4.ip_unprivileged_port_start: 0
    volumes:
      - source: "docker-certs"
        target: "/certs"
        type: "volume"
      - source: "docker-data"
        target: "/home/rootless/.local/share/docker"
        type: "volume"
volumes:
  claude-home:
    external: true
    name: "${DCC_CLAUDE_HOME_VOLUME:-dcc-claude-home}"
  codex-home:
    external: true
    name: "${DCC_CODEX_HOME_VOLUME:-dcc-codex-home}"
  docker-certs: {}
  docker-data: {}

